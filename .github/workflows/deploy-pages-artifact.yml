name: Deploy Pages Artifact

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Workflow run ID that uploaded the pages artifact
        required: true
        type: string

permissions:
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist-pages

      - name: Re-upload for deploy-pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - uses: actions/deploy-pages@v4
        id: deployment
