name: Deploy to GitHub Pages

on:
  push:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (live site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: live-src

      - name: Checkout preview source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == 'testing' && 'testing' || 'main' }}
          path: preview-src

      - name: Sync build config onto live checkout
        run: |
          cp preview-src/scripts/build-pages.mjs live-src/scripts/build-pages.mjs
          cp preview-src/scripts/build-preview-changelog.mjs live-src/scripts/build-preview-changelog.mjs
          cp preview-src/scripts/sync-preview-changelog.mjs live-src/scripts/sync-preview-changelog.mjs
          cp preview-src/scripts/trustPaths.mjs live-src/scripts/trustPaths.mjs
          cp preview-src/scripts/generate-icons.mjs live-src/scripts/generate-icons.mjs
          cp preview-src/src/config/trust-manifest.json live-src/src/config/trust-manifest.json
          cp preview-src/src/config/trustIds.ts live-src/src/config/trustIds.ts
          cp preview-src/src/config/getServiceConfig.ts live-src/src/config/getServiceConfig.ts
          cp preview-src/vite.config.ts live-src/vite.config.ts
          cp -r preview-src/assets/icon-sources live-src/assets/
          cp -r preview-src/public/wmas-icons live-src/public/

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: live-src/package-lock.json

      - name: Install dependencies (live)
        run: npm ci
        working-directory: live-src

      - name: Build live site from main
        run: BUILD_LIVE_ONLY=1 OUTPUT_DIR="${{ github.workspace }}/dist-pages" node scripts/build-pages.mjs
        working-directory: live-src

      - name: Install dependencies (preview)
        run: npm ci
        working-directory: preview-src

      - name: Build preview site from branch
        run: BUILD_PREVIEW_ONLY=1 OUTPUT_DIR="${{ github.workspace }}/dist-pages" node scripts/build-pages.mjs
        working-directory: preview-src

      - name: Update landing page from testing branch
        if: github.ref_name == 'testing'
        run: |
          LIVE_PACKAGE_VERSION=$(node -p "require('../live-src/package.json').version")
          INCLUDE_BLOG=0 BUILD_LANDING_ONLY=1 LIVE_PACKAGE_VERSION="$LIVE_PACKAGE_VERSION" OUTPUT_DIR="${{ github.workspace }}/dist-pages" node scripts/build-pages.mjs
        working-directory: preview-src

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
