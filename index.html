<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        var t = localStorage.getItem('resusci-time-theme');
        document.documentElement.dataset.theme = t === 'night' ? 'night' : 'day';
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4f1f" />
    <meta name="description" content="Resusci-Time — guided adult cardiac arrest protocol for ambulance resources" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
